<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Treinamentos</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="welcome-container">

        <section class="welcome-card">

            <div class="logo-container">
                <h1>SISS <span>Saúde</span></h1>
            </div>

            <h2>Plataforma de Treinamentos</h2>

            <p>
                Encontre rapidamente o treinamento que você precisa.
            </p>

            <div class="select-custom" id="selectMunicipio">

    <button type="button" class="select-trigger">
        <span id="municipioSelecionadoTexto">
            Selecione o município
        </span>

        <span class="select-seta">⌄</span>
    </button>

    <div class="select-opcoes">

        <button type="button" data-value="Osasco">
            Osasco
        </button>

        <button type="button" data-value="Itu">
            Itu
        </button>

        <button type="button" data-value="Guarulhos">
            Guarulhos
        </button>

        <button type="button" data-value="Santo André">
            Santo André
        </button>

        <button type="button" data-value="Valinhos">
            Valinhos
        </button>

        <button type="button" data-value="Barueri">
            Barueri
        </button>

        <button type="button" data-value="Mauá">
            Mauá
        </button>

        <button type="button" data-value="Jundiaí">
            Jundiaí
        </button>

        <button type="button" data-value="Águas Lindas">
            Águas Lindas
        </button>

        <button type="button" data-value="Itumbiara">
            Itumbiara
        </button>

        <button type="button" data-value="Piracicaba">
            Piracicaba
        </button>

        <button type="button" data-value="SAD">
            SAD
        </button>

        <button type="button" data-value="Campos">
            Campos
        </button>

        <button type="button" data-value="São Vicente">
            São Vicente
        </button>

        <button type="button" data-value="Paulínia">
            Paulínia
        </button>

    </div><br>

</div>

            <button id="btnContinuar">
                Continuar
            </button>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
