<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Treinamentos</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="welcome-container">

        <section class="welcome-card">

            <div class="logo-container">
                <h1>SISS <span>Saúde</span></h1>
            </div>

            <h2>Plataforma de Treinamentos</h2>

            <p>
                Encontre rapidamente o treinamento que você precisa.
            </p>

            <div class="municipio-container">

                <label for="municipio">Selecione seu município</label>

                <select id="municipio">
                    <option value="">Selecione...</option>
                    <option value="Itu">Itu</option>
                    <option value="Guarulhos">Guarulhos</option>
                    <option value="Osasco">Osasco</option>
                </select>

            </div>

            <button id="btnContinuar">
                Continuar
            </button>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
